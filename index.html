<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>MAKERMAKER · CAD in the browser</title>
    <meta name="description" content="Free CAD in the browser for people who build things: sketch, pull, round and cut parts, then export STEP, STL or SVG for the laser or 3D printer. Works offline, no account." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fluescher.ch/makermaker/" />
    <meta property="og:title" content="MAKERMAKER · CAD in the browser" />
    <meta property="og:description" content="Sketch, pull, round, cut, and send it to the laser or 3D printer. Free, offline, no account." />
    <meta property="og:image" content="https://fluescher.ch/makermaker/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- the loading screen: here, so it shows before the stylesheet and the app; the app removes it once it runs -->
    <script>
      try {
        const theme = localStorage.getItem('makermaker.theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <style>
      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: #f7f7f5;
      }
      /* the files' grey (#8a8a88) made the top bar's colours: the logo muted (#777), the name the text's (#222) */
      #loading .logo {
        filter: brightness(0.862);
      }
      #loading .name {
        filter: brightness(0.246);
      }
      /* dark: muted #9a9a98, text #e4e4e2 */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #loading {
          background: #18191b;
        }
        :root:not([data-theme='light']) #loading .logo {
          filter: brightness(1.116);
        }
        :root:not([data-theme='light']) #loading .name {
          filter: brightness(1.652);
        }
      }
      :root[data-theme='dark'] #loading {
        background: #18191b;
      }
      :root[data-theme='dark'] #loading .logo {
        filter: brightness(1.116);
      }
      :root[data-theme='dark'] #loading .name {
        filter: brightness(1.652);
      }
    </style>
  </head>
  <body>
    <div id="loading"><img class="logo" src="/src/ui/icons/logo.svg" alt="" width="20" height="20" /><img class="name" src="/src/ui/icons/makermaker.svg" alt="makermaker" width="115" height="12" /></div>
    <header id="topbar"></header>
    <aside id="left"></aside>
    <nav id="toolbar"></nav>
    <nav id="editbar"></nav>
    <div id="stage"><main id="viewport"></main></div>
    <aside id="right"></aside>
    <footer id="hint">
      <span id="hint-count"></span>
      <span id="hint-text"></span>

      <a class="link" href="https://buymeacoffee.com/falue" target="_blank" rel="noopener" title="Support MAKERMAKER">☕ Buy me a coffee</a>
      <span class="link" id="version" title="Commit %COMMIT%">%VERSION%</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
