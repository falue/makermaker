    <title>MAKERMAKER</title>
    <!-- the loading screen: here, so it shows before the stylesheet and the app; the app removes it once it runs -->
    <script>
      try {
        const theme = localStorage.getItem('makermaker.theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <style>
      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #f7f7f5;
        color: #222;
        font: 600 13px/1 system-ui, sans-serif;
        letter-spacing: 0.05em;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #loading {
          background: #18191b;
          color: #e4e4e2;
        }
      }
      :root[data-theme='dark'] #loading {
        background: #18191b;
        color: #e4e4e2;
      }
    </style>
  </head>
